plugins { id 'com.android.application' }
android {
    namespace 'dev.myflat.app'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.myflat.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.1.5'
        testInstrumentationRunner providers.gradleProperty('testRunner').getOrElse('dev.myflat.app.SmokeInstrumentation')
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
}
dependencies { implementation project(':scanner'); implementation 'com.airbnb.android:lottie:6.6.7'; implementation 'androidx.core:core:1.16.0'; implementation 'androidx.exifinterface:exifinterface:1.4.2'; implementation 'com.google.zxing:core:3.5.3'; testImplementation 'junit:junit:4.13.2' }
