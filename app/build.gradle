plugins { id 'com.android.application' }
android {
    namespace 'dev.myflat.app'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.myflat.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'dev.myflat.app.SmokeInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true } }
}
dependencies { implementation project(':scanner'); implementation 'androidx.core:core:1.16.0'; implementation 'androidx.exifinterface:exifinterface:1.4.2'; testImplementation 'junit:junit:4.13.2' }
